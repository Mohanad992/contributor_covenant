<style>
:root{--navy:#0e355f;--blue:#1d5f96;--teal:#0f7b78;--gold:#d69a19;--ink:#14202d;--muted:#5b6b7d;--line:#dce5ee;--paper:#f6f8fb;--white:#fff;--good:#16734b;--bad:#a92c34;--soft-good:#eaf7f0;--soft-bad:#fff0f1;--soft-blue:#eef5fb}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.48}.shell{width:min(1050px,92vw);margin:auto}.mast{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:20px 0;box-shadow:0 2px 10px #0d2f5526}.brand{display:flex;align-items:center;justify-content:space-between;gap:18px}.brand h1{font-size:20px;margin:0;letter-spacing:.04em}.brand p{margin:3px 0 0;opacity:.85;font-size:13px}.tag{font-size:12px;border:1px solid #ffffff55;border-radius:999px;padding:8px 11px;white-space:nowrap}.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.step{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 10px;color:var(--muted);font-size:12px;text-align:center}.step strong{display:block;color:var(--ink);font-size:13px}.step.active{border-color:var(--blue);box-shadow:0 0 0 2px #1d5f9618}.step.done{border-color:#9fd8bf;background:#f1fbf6}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 8px 25px #17324f0c;margin:18px 0}.hero{padding:36px 34px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--blue)}h2{margin:8px 0 10px;font-size:30px;line-height:1.15}h3{margin:0 0 8px}.lead{font-size:16px;color:var(--muted);max-width:780px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.stat{background:var(--soft-blue);padding:16px;border-radius:14px;text-align:center}.stat b{display:block;font-size:25px;color:var(--navy)}label{font-weight:700;display:block;margin-bottom:7px}input[type=text]{width:100%;padding:12px 14px;border:1px solid #b9c7d4;border-radius:10px;font:inherit}.btn{appearance:none;border:0;border-radius:11px;padding:12px 18px;font:inherit;font-weight:800;cursor:pointer;background:var(--navy);color:#fff}.btn:hover{filter:brightness(1.06)}.btn.secondary{background:#e9f0f7;color:var(--navy)}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.question{border:1px solid var(--line);border-radius:15px;padding:18px;margin:15px 0;background:#fff}.qtop{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.qnum{font-weight:900;color:var(--blue)}.topic{font-size:11px;background:#eff4f9;color:#4f6174;border-radius:999px;padding:4px 8px;white-space:nowrap}.stem{font-size:16px;font-weight:750;margin:6px 0 12px}.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid #d9e2eb;border-radius:10px;padding:11px 12px;margin:8px 0;cursor:pointer}.choice:hover{background:#f8fbfd}.choice input{margin-top:4px}.choice.selected{border-color:#6fa3cf;background:#f3f8fd}.quizbar{position:sticky;bottom:10px;background:#ffffffee;backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 10px 30px #1a355522}.alert{color:var(--bad);font-weight:700;margin-top:8px}.scorebox{display:grid;grid-template-columns:170px 1fr;gap:22px;align-items:center}.scorecircle{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--teal) calc(var(--pct)*1%),#e6edf4 0)}.scoreinner{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}.scoreinner b{font-size:31px;color:var(--navy);line-height:1}.scoreinner span{font-size:12px;color:var(--muted)}.mistake{border-left:5px solid var(--bad);background:var(--soft-bad);padding:15px 16px;border-radius:10px;margin:12px 0}.correct{border-left:5px solid var(--good);background:var(--soft-good);padding:15px 16px;border-radius:10px}.ansline{margin:5px 0}.wrong{color:var(--bad);font-weight:800}.right{color:var(--good);font-weight:800}.muted{color:var(--muted)}.tiny{font-size:12px}.finalgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.mini{background:#f5f8fb;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}.mini b{display:block;font-size:22px;color:var(--navy)}.source{font-size:12px;color:#718195;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}footer{padding:24px 0 34px;color:#738399;font-size:12px;text-align:center}@media(max-width:760px){.progress{grid-template-columns:1fr 1fr}.stats,.finalgrid{grid-template-columns:1fr 1fr}.scorebox{grid-template-columns:1fr;text-align:center}.scorecircle{margin:auto}.brand{align-items:flex-start}.tag{display:none}.card{padding:18px}.hero{padding:24px 20px}h2{font-size:25px}.quizbar{align-items:stretch;flex-direction:column}.quizbar .btn{width:100%}}@media print{.mast,.progress,.actions,.quizbar,footer{display:none!important}body{background:#fff}.card,.question{box-shadow:none;break-inside:avoid}.shell{width:100%}}
</style>

<body>
<header class="mast"><div class="shell brand"><div><h1>ENG103 · Research Writing Techniques</h1><p>Midterm Practice Assessment · Lectures 1–6</p></div><div class="tag">40 MCQs · 4 Parts · Analysis every 10</div></div></header>
<div class="shell"><div id="progress" class="progress"></div><main id="app"></main></div>
<footer>Practice material based on the supplied ENG103 Midterm Study Guide and the six lesson topics.</footer>
<script>
const parts = [
{
 title:"Part 1 · Research Foundations", short:"Foundations", subtitle:"Research definitions, core characteristics, knowledge building, and natural vs social science.",
 questions:[
 {id:1,topic:"Definition of research",stem:"Which statement best defines research in ENG103?",options:["A random search for facts on a topic","A systematic process for acquiring new knowledge or testing assumptions","A personal opinion supported by several examples","A summary of information from any available websites"],answer:1,why:"Research is systematic: it begins with a clear question/problem, uses a structured method, and produces an answer that can be checked and evaluated."},
 {id:2,topic:"Systematic",stem:"A study is described as systematic when it:",options:["follows organized steps","uses only numerical data","always includes an experiment","produces the expected result"],answer:0,why:"Systematic research follows an organized, planned sequence rather than random actions."},
 {id:3,topic:"Empirical",stem:"What does empirical mean in research?",options:["Based on personal beliefs","Based on evidence, observation, or data","Based only on experiments","Based on a broad theory"],answer:1,why:"Empirical means evidence-based. It does not mean that the study must be experimental."},
 {id:4,topic:"Critical",stem:"Which action best demonstrates the critical characteristic of research?",options:["Accepting findings because they are published","Questioning assumptions, methods, and findings","Collecting as much data as possible","Using the same method in every study"],answer:1,why:"Critical research evaluates assumptions, methods, evidence, limitations, and conclusions rather than accepting them automatically."},
 {id:5,topic:"Research process",stem:"Which sequence best represents the basic research process in the study guide?",options:["Answer → method → question","Question → method → credible answer","Method → opinion → answer","Data → question → assumption"],answer:1,why:"The guide summarizes research as a systematic process moving from a clear question to a method and then to a credible, checkable answer."},
 {id:6,topic:"Gathering vs producing",stem:"Writing a literature review using existing academic sources is mainly an example of:",options:["producing new data","gathering existing knowledge","experimental research","statistical testing"],answer:1,why:"A literature review gathers and synthesizes knowledge from existing credible sources rather than collecting new primary data."},
 {id:7,topic:"Gathering vs producing",stem:"A student designs a survey, collects responses, and analyzes the new data. This is mainly:",options:["gathering knowledge","producing knowledge","paraphrasing knowledge","transferability"],answer:1,why:"Collecting and analyzing new data produces knowledge within the course distinction."},
 {id:8,topic:"Social science",stem:"Which question is most clearly a social-science question?",options:["How does soil pH affect tomato growth?","How does remote work affect employees' sense of belonging?","How does heat change the expansion of metal?","How does salt concentration affect boiling point?"],answer:1,why:"Social science focuses on people, behavior, meaning, values, and social interaction."},
 {id:9,topic:"Natural vs social science",stem:"What mainly determines whether a topic is studied as natural science or social science?",options:["The length of the study","The researcher's job title","The focus of the research question","The number of participants"],answer:2,why:"The same broad topic can be studied in different disciplines. The focus of the question determines whether the study concerns physical/biological phenomena or people/social context."},
 {id:10,topic:"Social-science variation",stem:"Why may social-science findings vary across groups and settings?",options:["Social science does not use evidence","People and societies differ in culture, age, language, and norms","Social science never uses structured methods","Researchers must change their conclusions"],answer:1,why:"Human behavior and meaning are context-sensitive, so variation across cultures, groups, and settings can be expected."}
]},
{
 title:"Part 2 · Roles, Logic & Variables", short:"Terminology", subtitle:"Subject, participant, stakeholder, inductive/deductive reasoning, variables, and experimental groups.",
 questions:[
 {id:11,topic:"Participant",stem:"A participant is best defined as:",options:["anyone interested in the results","a person who willingly provides data","the organization funding the study","the full population being studied"],answer:1,why:"Participants are people who provide data to the study."},
 {id:12,topic:"Stakeholder",stem:"A charity funds a literacy study and plans to use the findings but answers no survey questions. The charity is a:",options:["participant","dependent variable","stakeholder","sample"],answer:2,why:"A stakeholder has an interest in the research process or results even if it does not provide data."},
 {id:13,topic:"Subject",stem:"In research terminology, a subject can be:",options:["only a person who signs a consent form","the person, group, situation, or case being studied","only the researcher conducting the study","only an organization funding the research"],answer:1,why:"The subject is the person, group, situation, or case under study; the term is broader than participant."},
 {id:14,topic:"Inductive reasoning",stem:"A researcher interviews students, identifies repeated patterns, and then develops an explanation. This reasoning is:",options:["deductive","inductive","experimental","causal"],answer:1,why:"Inductive reasoning moves from observations/data toward a broader explanation or theory: data → theory."},
 {id:15,topic:"Deductive reasoning",stem:"A researcher begins with the claim 'sleep affects GPA' and collects data to test it. This is:",options:["inductive reasoning","deductive reasoning","transferability","qualitative coding"],answer:1,why:"Deductive reasoning starts with a theory, claim, or hypothesis and then tests it with data: theory → data."},
 {id:16,topic:"Independent variable",stem:"A study tests whether three caffeine doses change reaction time. What is the independent variable?",options:["reaction time","caffeine dose","participants' age","number of observations"],answer:1,why:"The independent variable is the factor changed or compared—in this case, caffeine dose."},
 {id:17,topic:"Dependent variable",stem:"In the same caffeine study, what is the dependent variable?",options:["caffeine dose","reaction time","sleep the night before","type of cup used"],answer:1,why:"The dependent variable is the measured outcome—reaction time."},
 {id:18,topic:"Extraneous variable",stem:"In a study of tire type and lap time, which is the best example of an extraneous variable?",options:["tire type","lap time","driver skill","the research question"],answer:2,why:"Driver skill could affect lap time without being the main variable under study, so it is an extraneous variable."},
 {id:19,topic:"Control group",stem:"What is the main purpose of a control group?",options:["To receive a smaller amount of the treatment","To provide a comparison point without the treatment","To guarantee statistical significance","To increase the dependent variable"],answer:1,why:"The control group does not receive the treatment and provides the comparison needed to judge whether the treatment made a difference."},
 {id:20,topic:"Experimental group",stem:"In a trial of a new study app, Group A uses the app and Group B does not. Which group is experimental?",options:["Group A","Group B","Both groups","Neither group"],answer:0,why:"The experimental group receives the treatment or condition being tested; here, that is the study app."}
]},
{
 title:"Part 3 · Claims, Samples & Methods", short:"Methods", subtitle:"Hypotheses, samples, generalizability, transferability, research approaches, and correlation vs causation.",
 questions:[
 {id:21,topic:"Hypothesis",stem:"Which option is a proper hypothesis?",options:["Does room temperature affect typing speed?","Room temperature and typing speed","Office workers will type faster at 22°C than at 28°C","Typing speed is interesting to study"],answer:2,why:"A hypothesis is a specific, testable, predictive statement about a relationship between variables."},
 {id:22,topic:"Theory",stem:"A theory is best described as:",options:["a single testable prediction","a broader framework that explains patterns or phenomena","a research question written as a statement","a result that is statistically significant"],answer:1,why:"A theory is broader than a hypothesis and is used to explain patterns or phenomena."},
 {id:23,topic:"Population vs sample",stem:"A researcher wants to understand all 5,000 employees of a company but surveys 200. What is the sample?",options:["all 5,000 employees","the 200 surveyed employees","the company managers only","the research findings"],answer:1,why:"The sample is the smaller group actually studied; the population is the full group the study aims to understand."},
 {id:24,topic:"Generalizability",stem:"Generalizability means:",options:["applying findings from a sample to the same wider population","moving findings from one country to a different country","proving that one variable causes another","combining qualitative and quantitative data"],answer:0,why:"Generalizability concerns extending sample findings to the larger population from which that sample was drawn."},
 {id:25,topic:"Transferability",stem:"Using findings from cycling commuters in Amsterdam to consider commuting in Riyadh is mainly a question of:",options:["generalizability","transferability","deduction","statistical significance"],answer:1,why:"Transferability asks whether findings from one context might apply in a different context."},
 {id:26,topic:"Statistical significance",stem:"A statistically significant result is best understood as a result that:",options:["is always large and important","is unlikely to have occurred by chance according to statistical testing","proves causation","must be generalizable"],answer:1,why:"Statistical significance concerns how likely a result is to be due to chance; it does not automatically mean the effect is large or practically important."},
 {id:27,topic:"Quantitative",stem:"Which type of data is most clearly quantitative?",options:["interview stories","open-ended reflections","exam scores","observational field notes"],answer:2,why:"Quantitative research uses data that can be counted or measured and analyzed statistically, such as scores."},
 {id:28,topic:"Qualitative",stem:"Which study is most clearly qualitative?",options:["Comparing average test scores of 400 students","Counting the number of library visits","Interviewing students about how they experience exam stress","Calculating the correlation between sleep hours and GPA"],answer:2,why:"Qualitative research focuses on meanings, experiences, opinions, and perspectives, commonly using words and interviews."},
 {id:29,topic:"Mixed methods",stem:"A survey asks students to rate stress from 1–5 and also explain the causes in a paragraph. The study uses:",options:["only quantitative data","only qualitative data","mixed methods","only experimental data"],answer:2,why:"The numerical rating is quantitative and the written response is qualitative; together they form mixed methods."},
 {id:30,topic:"Correlation vs causation",stem:"A study finds that cities with more bookstores also have higher average incomes. Which conclusion is justified by that finding alone?",options:["Bookstores cause higher incomes","Higher incomes cause more bookstores","The variables are correlated, but causation is not established","A third variable is impossible"],answer:2,why:"Correlation shows that variables are related, but it does not establish direction of cause or rule out third variables such as city size or economic development."}
]},
{
 title:"Part 4 · APA Referencing & Academic Integrity", short:"APA & Integrity", subtitle:"Plagiarism, in-text citations, paraphrase/quotation, multiple authors, references, and secondary citation.",
 questions:[
 {id:31,topic:"Referencing",stem:"What is the main purpose of referencing?",options:["To make writing longer","To show where information comes from and give proper credit","To replace analysis with quotations","To avoid using any original ideas"],answer:1,why:"Referencing identifies sources, gives credit, supports claims, and helps readers locate the original material."},
 {id:32,topic:"Plagiarism",stem:"Which statement about plagiarism is correct?",options:["It applies only to copied words","It can involve words, ideas, images, or data used without proper acknowledgment","It is avoided whenever a source appears in the reference list","It cannot occur when information is paraphrased"],answer:1,why:"Plagiarism includes unacknowledged words, ideas, images, and data—not only exact copied wording."},
 {id:33,topic:"Narrative citation",stem:"Which is a correct APA narrative citation for a paraphrase by Lina Haddad published in 2021?",options:["(Haddad, 2021) explains that …","Haddad (2021) explains that …","Haddad, 2021 explains that …","(Haddad 2021, p. 1) explains that …"],answer:1,why:"In a narrative citation, the author's name appears in the sentence and the year follows in parentheses: Haddad (2021)."},
 {id:34,topic:"Parenthetical citation",stem:"Which is a correct APA parenthetical citation for a paraphrase by Smith from 2002?",options:["Smith (2002)","(Smith, 2002)","(Smith 2002, p.)","[Smith: 2002]"],answer:1,why:"A parenthetical citation places the author and year together in parentheses: (Smith, 2002)."},
 {id:35,topic:"Paraphrase",stem:"You rewrite a source's idea completely in your own words and sentence structure. What is still required?",options:["No citation is needed","Author and year citation","Quotation marks and page number in every case","Only the source title"],answer:1,why:"A paraphrase still uses another author's idea, so it needs an in-text citation with author and year."},
 {id:36,topic:"Direct quotation",stem:"Which parenthetical citation is correct for a direct quote from page 47 of a 2019 work by Okoro?",options:["(Okoro, 2019)","(Okoro, p. 47)","(Okoro, 2019, p. 47)","Okoro (2019, page forty-seven)"],answer:2,why:"A direct quotation requires author, year, and a page number, and the exact words should be placed in quotation marks."},
 {id:37,topic:"Two authors",stem:"Which narrative citation correctly uses a two-author source?",options:["Davis & Barry (2010)","Davis and Barry (2010)","Davis et al. (2010)","(Davis and Barry, 2010)"],answer:1,why:"APA uses 'and' between two authors when their names appear in the sentence. The ampersand (&) is used inside parentheses."},
 {id:38,topic:"Three or more authors",stem:"How should a work with three or more authors normally be cited in text in APA?",options:["List every surname every time","Use the first author's surname followed by et al.","Use only the final author's surname","Use the first two surnames followed by &"],answer:1,why:"For three or more authors, APA in-text citation uses the first author's surname plus et al."},
 {id:39,topic:"Journal reference",stem:"Which detail is correct when formatting an APA journal-article reference?",options:["The article title is written in full title case","The journal name and volume number are italicized","The issue number is italicized but the volume is not","A publisher must always be listed for a journal article"],answer:1,why:"In an APA journal reference, the article title is in sentence case, while the journal name and volume number are italicized. The issue number is in parentheses and is not italicized."},
 {id:40,topic:"Secondary citation",stem:"You read Scully (2017), which discusses Bloom et al. (1956), but you never read Bloom's original work. What should appear in your reference list?",options:["Bloom et al. (1956) only","Both Bloom et al. (1956) and Scully (2017)","Scully (2017) only","Neither source"],answer:2,why:"When using 'as cited in,' the reference list includes only the source you actually read—in this example, Scully (2017)."}
]}
];

const app=document.getElementById('app'); const progress=document.getElementById('progress');
let state={name:'',part:0,stage:'start',answers:{},scores:[]};
try{const saved=JSON.parse(localStorage.getItem('eng103_40_state')||'null'); if(saved&&saved.version===1) state=saved;}catch(e){}
state.version=1;
const save=()=>{try{localStorage.setItem('eng103_40_state',JSON.stringify(state));}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderProgress(){progress.innerHTML=parts.map((p,i)=>`<div class="step ${i===state.part&&state.stage!=='final'?'active':''} ${state.scores[i]!=null?'done':''}"><strong>${state.scores[i]!=null?'✓ ':''}${p.short}</strong>${state.scores[i]!=null?state.scores[i]+'/10':'10 questions'}</div>`).join('');}
function render(){renderProgress(); if(state.stage==='start') startView(); else if(state.stage==='quiz') quizView(); else if(state.stage==='analysis') analysisView(); else finalView(); window.scrollTo({top:0,behavior:'instant'});}
function startView(){app.innerHTML=`<section class="card hero"><div class="eyebrow">Midterm revision · Lectures 1–6</div><h2>40 MCQs with analysis after every 10</h2><p class="lead">The questions cover the definitions, distinctions, application rules, and APA conventions in your ENG103 material. Each part is marked separately, then you review every mistake before continuing.</p><div class="stats"><div class="stat"><b>40</b>MCQs</div><div class="stat"><b>4</b>parts</div><div class="stat"><b>10</b>questions before each analysis</div></div><label for="name">Student name</label><input type="text" id="name" placeholder="Enter student name" value="${esc(state.name||'')}"><div class="actions"><button class="btn" id="begin">Begin Part 1</button><button class="btn secondary" id="reset">Reset saved attempt</button></div></section>`;
document.getElementById('begin').onclick=()=>{const n=document.getElementById('name').value.trim(); if(!n){document.getElementById('name').focus();return;} state.name=n;state.stage='quiz';save();render();};document.getElementById('reset').onclick=()=>{localStorage.removeItem('eng103_40_state');state={name:'',part:0,stage:'start',answers:{},scores:[],version:1};render();};}
function quizView(){const p=parts[state.part];app.innerHTML=`<section class="card"><div class="eyebrow">${esc(p.title)}</div><h2>${esc(p.short)}: Questions ${state.part*10+1}–${state.part*10+10}</h2><p class="lead">${esc(p.subtitle)}</p><p class="tiny muted">Answer all 10 questions. The part is marked only when you press <b>Show Mark & Mistake Analysis</b>.</p></section><section id="questions">${p.questions.map(q=>questionHTML(q)).join('')}</section><div class="quizbar"><div><b id="count">${answeredCount()} / 10 answered</b><div id="warn" class="alert"></div></div><button class="btn" id="submitPart">Show Mark & Mistake Analysis</button></div>`;
 p.questions.forEach(q=>document.querySelectorAll(`input[name="q${q.id}"]`).forEach(inp=>inp.addEventListener('change',e=>{state.answers[q.id]=Number(e.target.value);save();document.querySelectorAll(`input[name="q${q.id}"]`).forEach(x=>x.closest('.choice').classList.toggle('selected',x.checked));document.getElementById('count').textContent=answeredCount()+' / 10 answered';document.getElementById('warn').textContent='';})));document.getElementById('submitPart').onclick=submitPart;}
function questionHTML(q){const chosen=state.answers[q.id];return `<article class="question"><div class="qtop"><div class="qnum">Question ${q.id}</div><div class="topic">${esc(q.topic)}</div></div><div class="stem">${esc(q.stem)}</div>${q.options.map((o,i)=>`<label class="choice ${chosen===i?'selected':''}"><input type="radio" name="q${q.id}" value="${i}" ${chosen===i?'checked':''}><span><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</span></label>`).join('')}</article>`;}
function answeredCount(){return parts[state.part].questions.filter(q=>state.answers[q.id]!=null).length;}
function submitPart(){if(answeredCount()<10){document.getElementById('warn').textContent='Please answer all 10 questions before marking this part.';return;}const p=parts[state.part];const score=p.questions.reduce((n,q)=>n+(state.answers[q.id]===q.answer?1:0),0);state.scores[state.part]=score;state.stage='analysis';save();render();}
function analysisView(){const p=parts[state.part],score=state.scores[state.part],wrong=p.questions.filter(q=>state.answers[q.id]!==q.answer),pct=score*10;app.innerHTML=`<section class="card"><div class="eyebrow">Part ${state.part+1} marked</div><div class="scorebox"><div class="scorecircle" style="--pct:${pct}"><div class="scoreinner"><div><b>${score}/10</b><span>${pct}%</span></div></div></div><div><h2>${wrong.length?'Mistake analysis':'Perfect score'}</h2><p class="lead">${wrong.length?`You missed ${wrong.length} question${wrong.length===1?'':'s'}. Review the exact concept and explanation below before moving on.`:'You answered all 10 questions correctly. Continue to the next part.'}</p></div></div></section><section class="card"><h3>${wrong.length?'Questions to revise':'Part review'}</h3>${wrong.length?wrong.map(mistakeHTML).join(''):`<div class="correct"><b>No mistakes in this part.</b><div class="muted">Your answers matched all 10 correct answers.</div></div>`}<div class="actions"><button class="btn" id="next">${state.part<3?'Continue to Part '+(state.part+2):'Show Final Report'}</button><button class="btn secondary" onclick="window.print()">Print this analysis</button></div></section>`;document.getElementById('next').onclick=()=>{if(state.part<3){state.part++;state.stage='quiz';}else state.stage='final';save();render();};}
function mistakeHTML(q){const your=state.answers[q.id],correct=q.answer;return `<div class="mistake"><b>Question ${q.id} · ${esc(q.topic)}</b><div class="ansline">${esc(q.stem)}</div><div class="ansline wrong">Your answer: ${String.fromCharCode(65+your)}. ${esc(q.options[your])}</div><div class="ansline right">Correct answer: ${String.fromCharCode(65+correct)}. ${esc(q.options[correct])}</div><div class="ansline"><b>Why:</b> ${esc(q.why)}</div></div>`;}
function finalView(){const total=state.scores.reduce((a,b)=>a+(b||0),0),pct=Math.round(total/40*100);const allWrong=parts.flatMap(p=>p.questions).filter(q=>state.answers[q.id]!==q.answer);const topicCounts={};allWrong.forEach(q=>topicCounts[q.topic]=(topicCounts[q.topic]||0)+1);const priorities=Object.entries(topicCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);app.innerHTML=`<section class="card"><div class="eyebrow">Completed · ${esc(state.name)}</div><div class="scorebox"><div class="scorecircle" style="--pct:${pct}"><div class="scoreinner"><div><b>${total}/40</b><span>${pct}% overall</span></div></div></div><div><h2>Final ENG103 practice report</h2><p class="lead">You completed all four 10-question sections. Use the part scores and revision priorities below to decide what to review before the midterm.</p></div></div></section><section class="card"><h3>Part scores</h3><div class="finalgrid">${parts.map((p,i)=>`<div class="mini"><span>${esc(p.short)}</span><b>${state.scores[i]}/10</b></div>`).join('')}</div></section><section class="card"><h3>Revision priorities</h3>${priorities.length?`<p class="muted">Topics below are ranked only by the number of mistakes in this attempt.</p>${priorities.map(([t,n])=>`<div class="mistake"><b>${esc(t)}</b><div>${n} mistake${n===1?'':'s'} across the exam.</div></div>`).join('')}`:`<div class="correct"><b>No revision priority detected.</b><div>You answered all 40 questions correctly.</div></div>`}<div class="actions"><button class="btn" onclick="window.print()">Print / Save as PDF</button><button class="btn secondary" id="restart">Start New Attempt</button></div><div class="source">Coverage: research definitions and characteristics; social vs natural sciences; research terminology and variables; experimental/control groups; hypothesis and theory; population/sample; generalizability and transferability; quantitative/qualitative/mixed methods; correlation vs causation; APA referencing and plagiarism.</div></section>`;document.getElementById('restart').onclick=()=>{if(confirm('Start a new attempt? This will clear the saved answers and scores.')){localStorage.removeItem('eng103_40_state');state={name:'',part:0,stage:'start',answers:{},scores:[],version:1};render();}};}
render();
</script>
